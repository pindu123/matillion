  components:
    Start:
      position:
        x: -620
        "y": -20
      tempMetlId:
    Query Result To Grid:
      position:
        x: -480
        "y": -20
      tempMetlId:
    Grid Iterator:
      position:
        x: -260
        "y": -30
      tempMetlId:
    Send Email:
      position:
        x: 80
        "y": -190
      tempMetlId:
    Logging:
      position:
        x: -100
        "y": -10
      tempMetlId:
    LoggingFailure:
      position:
        x: -100
        "y": -130
      tempMetlId:
    Copy Data:
      position:
        x: -260
